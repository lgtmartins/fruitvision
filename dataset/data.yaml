# FruitVision - dataset configuration
# Sem a chave "path", o Ultralytics resolve train/val a partir da pasta deste
# arquivo. ("path: ." seria relativo ao diretório de onde o comando é rodado.)
train: fruit-detection-dataset/images/train
val: fruit-detection-dataset/images/val

names:
  0: apple
  1: avocado
  2: banana
  3: guava
  4: kiwi
  5: mango
  6: orange
  7: peach
  8: pineapple

nc: 9
